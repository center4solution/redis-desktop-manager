appId: com.rdm.desktop
productName: RDM Desktop
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**
  - package.json
asarUnpack:
  - resources/**

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icons

win:
  target:
    - nsis
  icon: build/icon.png

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Disabled by default — electron-updater's checkForUpdates() then always
# reports "not-available" and never errors out for end users. To enable
# real auto-updates, uncomment and point at your GitHub repo, then run
# `electron-builder --publish always` from a maintainer machine/CI with a
# GH_TOKEN set (see https://www.electron.build/publish).
#
# publish:
#   provider: github
#   owner: your-org
#   repo: rdm-desktop
publish: null
